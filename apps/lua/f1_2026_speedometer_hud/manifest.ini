[ABOUT]
NAME = F1 2026 Speedometer HUD
AUTHOR = Zhaoyi Fan
VERSION = 0.9
DESCRIPTION = Broadcast-style HUD for Assetto Corsa and the VRC Formula Alpha 2026 Pro. Shows speed, driver inputs, battery charge, MGU-K power and SM/OT/Boost status. Follows the camera car and records energy data for replay playback.

[CORE]
LAZY = NONE  ; load at AC start and keep running regardless of window state, so replay recording never depends on the HUD being open

[WINDOW_0]
ID = main
NAME = F1 2026 Speedometer HUD
FUNCTION_MAIN = windowMain
FLAGS = AUTO_RESIZE, NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
SIZE = 680, 360

[WINDOW_1]
ID = settings
NAME = F1 2026 Speedometer HUD Settings
FUNCTION_MAIN = windowSettings
FLAGS = SETTINGS, AUTO_RESIZE
SIZE = 440, 560
