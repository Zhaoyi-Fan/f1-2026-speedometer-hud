[ABOUT]
NAME = F1 2026 Speedometer HUD
AUTHOR = Zhaoyi Fan
VERSION = 0.9
DESCRIPTION = Broadcast-style speedometer HUD for the 2026 F1 regulations (VRC Formula Alpha 2026 Pro) with a 2026-regulations energy panel: battery, MGU-K power and live cap, lap deploy/regen, STRAT/split/PU mode, Straight Mode / Overtake / Boost / Charge / Power-Limited states. Follows the camera-focused car and works in replays: while running it records its own energy stream for every car, so replays made with the app open keep the data. Read-only; touches no car or track file.

[CORE]
LAZY = NONE  ; load at AC start and keep running regardless of window state, so replay recording never depends on the HUD being open

[WINDOW_0]
ID = main
NAME = F1 2026 Speedometer HUD
FUNCTION_MAIN = windowMain
FLAGS = AUTO_RESIZE, NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
SIZE = 680, 360

[WINDOW_1]
ID = settings
NAME = F1 2026 Speedometer HUD Settings
FUNCTION_MAIN = windowSettings
FLAGS = SETTINGS, AUTO_RESIZE
SIZE = 440, 560
