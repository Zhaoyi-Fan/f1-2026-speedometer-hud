[ABOUT]
NAME = F1 2026 Speedometer HUD
AUTHOR = Zhaoyi Fan
VERSION = 0.9.39
DESCRIPTION = Broadcast-style HUD following the camera car. In-dial battery glyph with MGU-K flow ring, exact FA26 Pro and native FA26 adapters, conventional DRS display, vehicle-specific energy panels and replay state recording. Read-only car telemetry.

[CORE]
LAZY = NONE  ; load at AC start and keep running regardless of window state, so replay recording never depends on the HUD being open

